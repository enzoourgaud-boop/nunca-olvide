<title>El Camino de Cempasúchil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sancreek&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : une guirlande de papel picado en haut, puis une colonne de jeu ; la créature est une carte de lotería, la question à côté, les pouvoirs en bas. Un seul thème, la nuit des morts. */
:root{
  color-scheme:dark;
  --noche:#1a0f2b; --noche-2:#28173f; --noche-3:#3d2560;
  --papel:#fff1dc; --tinta:#21142f; --tinta-2:#6a5878;
  --cempa:#ff9f1c; --cempa-sombra:#b5620a; --rosa:#ff3d8b; --turquesa:#22d1c6; --morado:#9b6cff;
  --texto:#f7ecff; --texto-2:#bfa9d6;
  --display:"Sancreek","Rockwell","Georgia",serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{background:var(--noche);min-height:100%}
body{background:var(--noche);color:var(--texto);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(ellipse at 50% -10%,#3a1d55,transparent 60%)}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(2.1rem,7.5vw,3.6rem);line-height:1.05;color:var(--cempa)}
h2{font-size:1.6rem;color:var(--cempa)}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--turquesa);outline-offset:2px}
.muted{color:var(--texto-2)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--texto-2);font-weight:700}

/* papel picado */
.picado{display:flex;justify-content:center;gap:4px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;padding-top:6px;border-top:2px solid var(--noche-3);overflow:hidden;height:64px}
.picado svg{flex:none;width:52px;height:58px;transform-origin:top center;animation:viento 4s ease-in-out infinite}
.picado svg:nth-child(2n){animation-delay:-1.3s}.picado svg:nth-child(3n){animation-delay:-2.6s}
@keyframes viento{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

.btn{background:var(--cempa);color:var(--tinta);border:0;border-radius:999px;padding:13px 26px;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 var(--cempa-sombra)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cempa-sombra)}

/* carte lotería */
.carta{background:var(--papel);color:var(--tinta);border-radius:12px;border:5px solid var(--c,var(--rosa));padding:6px 8px 0;width:150px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.carta .num{position:absolute;top:4px;left:9px;font-family:var(--display);font-size:1.1rem}
.carta .fig{font-size:4.4rem;line-height:1.25;padding-top:14px;position:relative}
.carta .fig .top{position:absolute;left:50%;top:-.02em;transform:translateX(-50%);font-size:.62em}
.carta .nom{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.74rem;text-align:center;border-top:3px solid var(--c,var(--rosa));width:calc(100% + 16px);padding:6px 4px;margin-top:4px;line-height:1.15}

/* portada */
.portada{display:flex;flex-direction:column;gap:22px}
.portada .lead{font-size:1.1rem;max-width:60ch}
.cartas{display:flex;gap:16px;flex-wrap:wrap}
.cartas .carta:nth-child(odd){transform:rotate(-3deg)}
.cartas .carta:nth-child(even){transform:rotate(2deg)}
.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.reglas div{border-top:3px solid var(--noche-3);padding-top:10px}
.reglas b{display:block;color:var(--cempa)}
.fila{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* HUD */
.hud{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.hp{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0}
.bar{flex:1;height:14px;background:var(--noche-3);border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--turquesa);border-radius:99px;transition:width .3s}
.bar.foe i{background:var(--rosa)}
.hp b{font-variant-numeric:tabular-nums}
.chip{background:var(--noche-2);border-radius:99px;padding:4px 12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:var(--cempa);color:var(--tinta)}
.ruta{display:flex;align-items:center;gap:6px;font-weight:700}
.ruta i{width:11px;height:11px;border-radius:50%;background:var(--noche-3);display:block}
.ruta i.jefe{border-radius:2px;transform:rotate(45deg)}
.ruta i.ok{background:var(--turquesa)} .ruta i.act{background:var(--cempa)}

/* combat */
.arena{display:flex;gap:22px;align-items:flex-start}
.foe{display:flex;flex-direction:column;gap:12px;align-items:stretch;flex:none;width:150px}
.foe .vida{display:flex;flex-direction:column;gap:4px}
.foe .atk{font-size:.85rem;color:var(--texto-2)}
.foe .furia{font-size:.85rem;color:var(--rosa);font-weight:700}
.qa{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.tipo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--k);color:var(--tinta)}
.tag.vocab{--k:var(--turquesa)} .tag.conj{--k:var(--cempa)} .tag.gram{--k:var(--morado)} .tag.cultura{--k:var(--rosa)}
.crono{display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.crono .bar{height:10px}
.crono .bar i{background:var(--cempa);transition:width .25s linear}
.crono.urge .bar i{background:var(--rosa)}
.crono.urge b{color:var(--rosa)}
.crono b{min-width:3.2em;text-align:right}
.enun{font-size:clamp(1.3rem,4.4vw,1.85rem);font-weight:700;line-height:1.28;overflow-wrap:anywhere}
.enun .emo{font-size:1.4em;margin-right:.25em;vertical-align:-.12em}
.enun .hueco{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--cempa);color:var(--cempa);text-align:center;padding:0 6px}
.enun small{display:block;font-size:1rem;font-weight:400;color:var(--turquesa)}
.pista{background:var(--noche-2);border-radius:10px;padding:9px 13px;font-size:.98rem}
.pista b{color:var(--cempa)}
.pista .mask{font-family:ui-monospace,Consolas,monospace;letter-spacing:.2em;font-size:1.1rem;overflow-wrap:anywhere}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{background:var(--papel);color:var(--tinta);border:0;border-radius:var(--r);padding:14px;font-size:1.06rem;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.35);min-width:0;overflow-wrap:anywhere}
.op kbd{font:700 .8rem var(--body);background:var(--tinta);color:var(--papel);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.op:disabled{cursor:default}
.op.out{opacity:.25;box-shadow:none}
.op.good{background:var(--turquesa)} .op.bad{background:var(--rosa)}
.escr{display:flex;gap:10px;flex-wrap:wrap}
.escr input{flex:1 1 220px;min-width:0;font:700 1.2rem var(--body);padding:12px 14px;border-radius:var(--r);border:3px solid var(--noche-3);background:var(--papel);color:var(--tinta)}
.tildes{display:flex;gap:6px;flex-wrap:wrap}
.tildes button{background:var(--noche-2);border:0;border-radius:8px;width:38px;height:38px;font-weight:700;font-size:1.05rem}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--noche-2);border:3px solid var(--k)}
.fb.ok{--k:var(--turquesa)} .fb.ko{--k:var(--rosa)} .fb.casi{--k:var(--cempa)}
.fb h3{color:var(--k);font-size:1.4rem}
.fb .sol b{color:var(--cempa);font-size:1.12rem}
.fb .alerta{color:var(--rosa);font-weight:700}

/* pouvoirs */
.poderes{display:flex;gap:8px;flex-wrap:wrap;border-top:3px solid var(--noche-3);padding-top:14px}
.pod{background:var(--noche-2);border:2px solid var(--noche-3);border-radius:12px;padding:7px 12px;display:flex;gap:8px;align-items:center;font-weight:700}
.pod span{font-size:1.25rem}
.pod em{font-style:normal;background:var(--cempa);color:var(--tinta);border-radius:99px;min-width:22px;text-align:center;font-size:.85rem;padding:1px 6px}
.pod:disabled{opacity:.4;cursor:default}
.pod.rel{border-style:dashed;cursor:default}
.poderes .lbl{flex-basis:100%}

/* choix / marché */
.elige{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.item{background:var(--papel);color:var(--tinta);border:0;border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.item .ico{font-size:2.2rem;line-height:1}
.item .nm{font-family:var(--display);font-size:1.15rem}
.item .ds{font-size:.95rem;color:var(--tinta-2)}
.item .tp{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--tinta-2)}
.item .px{font-weight:700;margin-top:auto}
.item:disabled{opacity:.45;cursor:default;box-shadow:none}
.aviso{background:var(--noche-2);border:3px solid var(--rosa);border-radius:var(--r);padding:12px 16px}
.aviso b{color:var(--rosa)}

/* fin */
.stats{display:flex;gap:12px 28px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--display);font-size:1.9rem;color:var(--cempa);font-variant-numeric:tabular-nums}
.carnet{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.carnet li{background:var(--noche-2);border-radius:10px;padding:10px 14px}
.carnet .q{font-weight:700}.carnet .a{color:var(--turquesa);font-weight:700}.carnet .r{color:var(--texto-2);font-size:.93rem}

@keyframes golpe{0%,100%{transform:none}25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
@keyframes dano{0%{background:var(--rosa)}100%{background:transparent}}
.carta.hit{animation:golpe .35s}
.hud.hit{animation:dano .5s;border-radius:10px}
@media (prefers-reduced-motion:reduce){.carta.hit,.hud.hit,.picado svg{animation:none}.bar i{transition:none}}
@media (max-width:620px){
  .arena{flex-direction:column;gap:14px}
  .foe{flex-direction:row;align-items:center;width:100%}
  .foe .vida{flex:1;min-width:0}
  .carta{width:108px}.carta .fig{font-size:2.8rem}.carta .nom{font-size:.6rem}
  .ops{grid-template-columns:1fr}
  .cartas .carta{width:98px}
}
</style>

/* ================== OUTILS ================== */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm = s => String(s).toLowerCase().replace(/[¿?¡!.,;:«»"()]/g,'').replace(/[’`´]/g,"'").replace(/\s+/g,' ').trim();
const deacc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const sinArt = s => s.replace(/^(el|la|los|las|un|una|le|l'|les)\s*/,'');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ================== PAPEL PICADO ================== */
(function(){
  const cols=['#ff3d8b','#ff9f1c','#22d1c6','#9b6cff','#ffd23f','#3ddc84'];
  const circ=(cx,cy,r)=>`M${cx-r},${cy}a${r},${r} 0 1,0 ${r*2},0a${r},${r} 0 1,0 ${-r*2},0Z`;
  const dia=(cx,cy,s)=>`M${cx},${cy-s}L${cx+s},${cy}L${cx},${cy+s}L${cx-s},${cy}Z`;
  const outer='M0,0H52V50L47.7,56L43.3,50L39,56L34.7,50L30.3,56L26,50L21.7,56L17.3,50L13,56L8.7,50L4.3,56L0,50Z';
  let holes=circ(26,24,5);
  for(let i=0;i<8;i++){const a=i*Math.PI/4;holes+=circ(26+11*Math.cos(a),24+11*Math.sin(a),2.6)}
  holes+=dia(8,9,3.5)+dia(44,9,3.5)+dia(8,41,3.5)+dia(44,41,3.5);
  let h='';
  for(let i=0;i<26;i++) h+=`<svg viewBox="0 0 52 58"><path fill="${cols[i%cols.length]}" fill-rule="evenodd" d="${outer}${holes}"/></svg>`;
  document.getElementById('picado').innerHTML=h;
})();

/* ================== ÉTAT ================== */
let S = {screen:'title'};
let fx = '';

function newRun(){
  S = {screen:'combat',hp:12,max:12,gold:0,act:0,room:0,inv:{trad:1,tij:1,chu:1},rel:{},streak:0,
       errors:[],retry:[],seen:{},ok:0,ko:0,casi:0,won:0,order:ACTOS.map(()=>shuffle([0,1,2])),enemy:null,q:null,fb:null,used:{},typed:''};
  startFight();
}
function startFight(){
  const A=ACTOS[S.act], boss=S.room===3;
  const d=boss?A.boss:A.foes[S.order[S.act][S.room]];
  S.enemy={n:d.n,e:d.e,top:d.top,k:d.k,hp:boss?d.hp:A.hp+(S.room>1?1:0),atk:boss?d.atk:A.atk,boss,final:!!d.final,rage:false};
  S.enemy.max=S.enemy.hp; S.screen='combat'; nextQ();
}

/* ================== QUESTIONS ================== */
function lvl(){
  const E=S.enemy;
  if(E.final) return Math.random()<.75?4:3;
  const L=S.act+1; return (L===1||Math.random()<.65)?L:L-1;
}
function writeChance(){ if(S.enemy.final) return .75; return [.15,.3,.45][S.act]+(S.enemy.boss?.1:0) }
function fresh(list,keyf){const f=list.filter(x=>!S.seen[keyf(x)]);return f.length?pick(f):pick(list)}
function finish(q){
  q.mode = (q.w && Math.random()<writeChance()) ? 'write' : 'qcm';
  q.options = shuffle([q.a,...q.o]);
  return q;
}
function mkVocab(L){
  L=Math.min(L,2);
  const pool=VOC.filter(v=>v[3]===L), w=fresh(pool,v=>'v'+v[0]);
  const toEs=Math.random()<.6, a=toEs?0:1, ans=w[a];
  const others=shuffle(VOC.filter(x=>x!==w)).slice(0,3).map(x=>x[a]);
  const core=sinArt(ans);
  return finish({key:'v'+w[0],t:'vocab',w:toEs,
    label:toEs?'Comment dit-on en espagnol ?':'Que veut dire ce mot ?',
    html:(w[2]?'<span class="emo" aria-hidden="true">'+w[2]+'</span>':'')+esc(w[1-a]),plain:w[1-a],a:ans,o:others,
    r:'La réponse commence par « '+core[0].toUpperCase()+' » et compte '+core.replace(/[^\p{L}]/gu,'').length+' lettres.',
    note:w[0]+' = '+w[1],vocab:true});
}
function mkEstar(){
  let p=rnd(6), n=0; while(S.seen['e'+p]&&n++<6)p=rnd(6);
  return finish({key:'e'+p,t:'conj',w:1,label:'Conjugue ESTAR au présent',
    html:'estar<small>'+PRON[p][0]+' …</small>',plain:'estar ('+PRON[p][0]+')',a:ESTAR[p],o:shuffle(ESTAR.filter((_,i)=>i!==p)).slice(0,3),
    tr:'estar = être (pour situer, ou avec le gérondif) · '+PRON[p][0]+' = '+PRON[p][1],
    r:'estar : estoy, estás, está, estamos, estáis, están.',note:PRON[p][0]+' '+ESTAR[p]});
}
function mkGer(L){
  const g=fresh(GER.filter(x=>x[4]===Math.min(Math.max(L,2),3)),x=>'g'+x[0]);
  return finish({key:'g'+g[0],t:'conj',w:1,label:'Donne le gérondif',
    html:esc(g[0])+'<small>'+esc(g[1])+'</small>',plain:'gérondif de '+g[0],a:g[2],o:g[3],
    r:g[5],note:g[0]+' → '+g[2]});
}
function mkFull(){
  const g=pick(GER), p=rnd(6), ans=ESTAR[p]+' '+g[2];
  const o=[ESTAR[(p+1+rnd(5))%6]+' '+g[2], ESTAR[p]+' '+g[3][0], ['soy','eres','es','somos','sois','son'][p]+' '+g[2]];
  return finish({key:'f'+g[0]+p,t:'conj',w:1,label:'Mets à la forme ESTAR + gérondif',
    html:esc(g[0])+'<small>'+PRON[p][0]+' … (être en train de '+esc(g[1])+')</small>',plain:g[0]+' ('+PRON[p][0]+'), estar + gérondif',a:ans,o,
    r:ESTAR[p]+' + '+g[5],note:PRON[p][0]+' '+ans});
}
function mkQS(t,L){
  let pool=QS.filter(q=>q.t===t&&q.l===L);
  if(!pool.length) pool=QS.filter(q=>q.t===t&&q.l<=L);
  const q=fresh(pool,x=>'q'+x.q);
  return finish({...q,key:'q'+q.q,label:TYPES[q.t],plain:q.q,note:q.q.includes('___')?q.q.split('___').reduce((s,part,i)=>s+(i?String(q.a).split(' / ')[i-1]||q.a:'')+part,''):q.a,o:[...q.o]});
}
function nextQ(){
  let q;
  if(S.retry.length>1 && Math.random()<.3 && !S.enemy.final){ q=S.retry.shift(); q.options=shuffle(q.options); q.again=true; }
  else{
    const L=lvl();
    if(L===4) q=mkQS(Math.random()<.2?'cultura':pick(['conj','gram']),4);
    else{
      const t=pick(['vocab','conj','gram','cultura']);
      if(t==='vocab') q=mkVocab(L);
      else if(t==='conj'){
        const r=Math.random();
        q = L===1 ? (r<.5?mkEstar():mkQS('conj',1)) : L===2 ? (r<.4?mkGer(2):mkQS('conj',2)) : (r<.3?mkGer(3):r<.55?mkFull():mkQS('conj',3));
      }
      else q=mkQS(t,L);
    }
  }
  S.seen[q.key]=1; S.q=q; S.fb=null; S.used={}; S.typed=''; S.hidden=[]; S.mask=''; S.picked=null;
  S.tMax=timeFor(q); S.tLeft=S.tMax;
}
// Chrono : 30 s à l'acte 1, 25 s à l'acte 2, 20 s à l'acte 3 ; +10 s pour une réponse à écrire
function timeFor(q){ return ([30,25,20][S.act]+(q.mode==='write'?10:0))*1000 }

/* ================== RÉSOLUTION ================== */
function check(q,val){
  if(q.mode==='qcm') return val===q.a?'ok':'ko';
  let n=norm(val); if(!n) return null;
  const goods=[q.a,...(q.alt||[])].map(norm);
  const cmp = x => q.vocab ? sinArt(x) : x;
  n=cmp(n);
  if(goods.some(g=>cmp(g)===n)) return 'ok';
  if(goods.some(g=>deacc(cmp(g))===deacc(n))) return S.rel.til?'ok':'casi';
  return 'ko';
}
function answer(val,oracle,timeout){
  if(S.fb) return;
  const q=S.q, E=S.enemy, res=oracle?'ok':timeout?'ko':check(q,val);
  if(!res) return;
  S.picked=val;
  const fb={res,lines:[]};
  if(res==='ok'){
    let dmg=1;
    if(!oracle){
      S.streak++; S.ok++;
      dmg+=(S.rel.vel||0);
      if(q.mode==='write') dmg+=1+(S.rel.plu||0);
      const th=S.rel.mar?2:3; if(S.streak>=th){dmg+=S.rel.mar?2:1; fb.combo=S.streak}
      S.retry=S.retry.filter(x=>x.key!==q.key);
    }
    const g=1+(S.rel.pin||0); S.gold+=g;
    E.hp=Math.max(0,E.hp-dmg);
    fb.title=oracle?'El Oráculo ha hablado':pick(['¡Muy bien!','¡Perfecto!','¡Órale!','¡Eso es!','¡Qué padre!']);
    fb.lines.push(E.n+' perd '+dmg+' PV'+(fb.combo?' (série de '+fb.combo+')':'')+(q.mode==='write'&&!oracle?', réponse écrite : dégâts renforcés':'')+'. +'+g+' 🪙');
    if(E.final && !E.rage && E.hp>0 && E.hp<=E.max/2){E.rage=true; E.atk+=1; fb.alerta='La Catrina se met en colère : ses attaques font maintenant '+E.atk+' dégâts !'}
    fx='foe';
  }else if(res==='casi'){
    S.casi++; fb.title='¡Casi!';
    fb.lines.push('Il manque un accent. Personne n\'est blessé, la série continue.');
    logErr(q,val);
  }else{
    S.ko++; S.streak=0; fb.title=timeout?'¡Se acabó el tiempo!':pick(['¡Ay, caramba!','¡Qué pena!','¡Uy!']);
    if(timeout) fb.lines.push('Le temps est écoulé : cela compte comme une erreur.');
    if(S.inv.esc>0){S.inv.esc--; fb.lines.push('Ton Escudo bloque l\'attaque de '+E.n+'.')}
    else{S.hp=Math.max(0,S.hp-E.atk); fb.lines.push(E.n+' t\'inflige '+E.atk+' dégâts.'); fx='me'}
    logErr(q,val);
    if(!S.retry.some(x=>x.key===q.key)) S.retry.push(JSON.parse(JSON.stringify(q)));
  }
  S.fb=fb; render();
}
function logErr(q){ if(!S.errors.some(e=>e.key===q.key)) S.errors.push({key:q.key,q:q.plain,a:q.note,r:q.vocab?'':q.r}) }
function cont(){
  const E=S.enemy;
  if(S.hp<=0) return end(false);
  if(E.hp<=0){
    S.won++; S.gold+=E.boss?6:3;
    if(S.rel.cem) S.hp=Math.min(S.max,S.hp+2);
    if(E.boss){
      if(E.final) return end(true);
      S.hp=Math.min(S.max,S.hp+3);
      S.offer=[...shuffle(avail(false)).slice(0,2),...shuffle(avail(true)).slice(0,2)].map(id=>({id,sold:false}));
      S.screen='shop';
    }else{
      S.offer=shuffle([...shuffle(avail(false)).slice(0,2),...shuffle(avail(true)).slice(0,2)]).slice(0,3).map(id=>({id}));
      S.screen='reward';
    }
    return render();
  }
  nextQ(); render();
}
function avail(rel){return Object.keys(ITEMS).filter(id=>!!ITEMS[id].rel===rel && (!rel || (S.rel[id]||0)<ITEMS[id].max))}
function gain(id){
  if(ITEMS[id].rel){S.rel[id]=(S.rel[id]||0)+1; if(id==='cor'){S.max+=4;S.hp+=4}}
  else S.inv[id]=(S.inv[id]||0)+1;
}
function usePower(id){
  const q=S.q; if(S.fb||!(S.inv[id]>0)) return;
  if(id==='trad'){ if(!q.tr||S.used.trad) return; S.used.trad=1 }
  else if(id==='chu'){ if(S.used.chu) return; S.used.chu=1 }
  else if(id==='tij'){
    if(S.used.tij) return; S.used.tij=1;
    if(q.mode==='qcm') S.hidden=shuffle(q.options.filter(o=>o!==q.a)).slice(0,2);
    else {let i=0; S.mask=[...q.a].map(c=>/\p{L}/u.test(c)?(i++%2===0?c:'_'):c).join('')}
  }
  else if(id==='cho'){ if(S.hp>=S.max) return; S.hp=Math.min(S.max,S.hp+5) }
  else if(id==='cam'){ S.inv.cam--; nextQ(); return render() }
  else if(id==='rel'){ S.tLeft+=15000; S.tMax=Math.max(S.tMax,S.tLeft) }
  else if(id==='ora'){ S.inv.ora--; return answer(q.a,true) }
  else return;
  S.inv[id]--; render();
}
function end(win){
  S.screen='over'; S.win=win;
  const b=store('cempasuchil-best')||{won:0,wins:0};
  store('cempasuchil-best',{won:Math.max(b.won,S.won),wins:b.wins+(win?1:0)});
  render();
}

/* ================== AFFICHAGE ================== */
const $app=document.getElementById('app');
function carta(e,color,cls){return '<div class="carta '+(cls||'')+'" style="--c:'+color+'"><span class="num">'+e.k+'</span><div class="fig">'+e.e+(e.top?'<span class="top">'+e.top+'</span>':'')+'</div><div class="nom">'+esc(e.n)+'</div></div>'}
function hud(){
  const dots=[0,1,2,3].map(i=>'<i class="'+(i===3?'jefe ':'')+(i<S.room?'ok':i===S.room?'act':'')+'"></i>').join('');
  const th=S.rel.mar?2:3;
  return '<header class="hud '+(fx==='me'?'hit':'')+'">'+
   '<div class="hp"><span class="lbl">Vida</span><div class="bar"><i style="width:'+(100*S.hp/S.max)+'%"></i></div><b>'+S.hp+'/'+S.max+'</b></div>'+
   '<span class="chip '+(S.streak>=th?'on':'')+'" title="Bonnes réponses d\'affilée">🔥 '+S.streak+'</span>'+
   '<span class="chip" title="Monedas">🪙 '+S.gold+'</span>'+
   '<div class="ruta"><span>Acte '+(S.act+1)+' · '+ACTOS[S.act].n+'</span>'+dots+'</div></header>';
}
function poderes(inCombat){
  const q=S.q; let h='<div class="poderes"><span class="lbl">Tes pouvoirs</span>';
  const ids=Object.keys(ITEMS).filter(id=>!ITEMS[id].rel && S.inv[id]>0);
  for(const id of ids){
    const it=ITEMS[id]; let dis=!inCombat||!!S.fb||!!it.auto;
    if(inCombat&&!dis){
      if(id==='trad') dis=!q.tr||!!S.used.trad;
      if(id==='chu'||id==='tij') dis=!!S.used[id];
      if(id==='cho') dis=S.hp>=S.max;
    }
    h+='<button class="pod" data-a="pow" data-v="'+id+'" '+(dis?'disabled':'')+' title="'+esc(it.d)+'"><span>'+it.e+'</span>'+it.n+(it.auto?' (auto)':'')+'<em>'+S.inv[id]+'</em></button>';
  }
  for(const id of Object.keys(S.rel)){const it=ITEMS[id]; h+='<span class="pod rel" title="'+esc(it.d)+'"><span>'+it.e+'</span>'+it.n+(S.rel[id]>1?'<em>'+S.rel[id]+'</em>':'')+'</span>'}
  if(!ids.length&&!Object.keys(S.rel).length) h+='<span class="muted">Aucun pour l\'instant. Gagne un combat pour en choisir un.</span>';
  return h+'</div>';
}
function vCombat(){
  const q=S.q,E=S.enemy,fb=S.fb,A=ACTOS[S.act];
  let enun;
  if(q.html) enun=q.html;
  else if(q.q.includes('___')){const parts=String(q.a).split(' / '); let i=0; enun=esc(q.q).replace(/___/g,()=>'<span class="hueco">'+(fb?esc(parts[i++]||q.a):'&nbsp;')+'</span>')}
  else enun=esc(q.q);
  let h=hud()+'<section class="arena"><div class="foe">'+carta(E,A.c,fx==='foe'?'hit':'')+
    '<div class="vida"><span class="lbl">'+(E.final?'Jefa final':E.boss?'Jefe':'Enemigo')+'</span><div class="bar foe"><i style="width:'+(100*E.hp/E.max)+'%"></i></div><span class="atk">'+E.hp+'/'+E.max+' PV · attaque '+E.atk+'</span>'+(E.rage?'<span class="furia">En colère</span>':'')+'</div></div>'+
    '<div class="qa"><div class="tipo"><span class="tag '+q.t+'">'+TYPES[q.t]+'</span><span class="lbl">'+esc(q.label!==TYPES[q.t]?q.label:'')+(q.mode==='write'?' à l\'écrit':'')+(q.again?' · revanche':'')+'</span></div>'+(fb?'':'<div class="crono" id="crono" role="timer" aria-label="Temps restant"><span aria-hidden="true">⏱️</span><div class="bar"><i></i></div><b></b></div>')+'<div class="enun" lang="'+(q.t==='cultura'||/^[¿A-ZÁÉ]/.test(q.q||'')&&!/^(Comment|Traduis|Donne)/.test(q.q||'')?'es':'fr')+'">'+enun+'</div>';
  if(S.used.trad) h+='<div class="pista"><b>Traductor</b> '+esc(q.tr)+'</div>';
  if(S.used.chu) h+='<div class="pista"><b>Chuleta</b> '+esc(q.r)+'</div>';
  if(S.mask) h+='<div class="pista"><b>Tijeras</b> <span class="mask">'+esc(S.mask)+'</span></div>';
  if(q.mode==='qcm'){
    h+='<div class="ops">'+q.options.map((o,i)=>{
      let c='', dis=!!fb;
      if(S.hidden.includes(o)){c='out';dis=true}
      if(fb){ if(o===q.a)c='good'; else if(o===S.picked)c='bad'; }
      return '<button class="op '+c+'" data-a="opt" data-v="'+i+'" '+(dis?'disabled':'')+'><kbd>'+(i+1)+'</kbd><span lang="es">'+esc(o)+'</span></button>'}).join('')+'</div>';
  }else if(!fb){
    h+='<form class="escr" data-f="write"><input id="rep" lang="es" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ta réponse en espagnol…" aria-label="Ta réponse en espagnol" value="'+esc(S.typed)+'"><button class="btn" type="submit">Valider</button></form>'+
       '<div class="tildes" aria-label="Lettres accentuées">'+[...'áéíóúñü¿¡'].map(c=>'<button type="button" data-a="chr" data-v="'+c+'">'+c+'</button>').join('')+'</div>';
  }
  if(fb){
    h+='<div class="fb '+fb.res+'" role="status"><h3>'+fb.title+'</h3>';
    if(fb.res!=='ok'||q.mode==='write') h+='<p class="sol">'+(q.mode==='write'&&fb.res!=='ok'&&S.picked?'Tu as écrit « '+esc(S.picked)+' ». ':'')+'Bonne réponse : <b lang="es">'+esc(q.a)+'</b></p>';
    if(fb.res==='ko'&&!q.vocab&&q.r) h+='<p>'+esc(q.r)+'</p>';
    h+=fb.lines.map(l=>'<p class="muted">'+esc(l)+'</p>').join('');
    if(fb.alerta) h+='<p class="alerta">'+esc(fb.alerta)+'</p>';
    const txt=S.hp<=0?'Voir le bilan':E.hp<=0?(E.n+(E.n.startsWith('La ')?' est vaincue !':' est vaincu !')):'Continuer';
    h+='<div><button class="btn" id="cont" data-a="cont">'+txt+'</button></div></div>';
  }
  h+='</div></section>'+poderes(true);
  return h;
}
function itemCard(o,i,shop){
  const it=ITEMS[o.id], dis=shop&&(o.sold||S.gold<it.p);
  return '<button class="item" data-a="'+(shop?'buy':'take')+'" data-v="'+i+'" '+(dis?'disabled':'')+'><span class="ico">'+it.e+'</span><span class="tp">'+(it.rel?'Relique permanente':'Aide à utiliser une fois')+'</span><span class="nm">'+it.n+'</span><span class="ds">'+it.d+'</span>'+(shop?'<span class="px">'+(o.sold?'Acheté':'🪙 '+it.p)+'</span>':'')+'</button>';
}
function vReward(){
  const next=S.room===3?ACTOS[S.act].boss:null;
  return hud()+'<h2>¡Victoria! Choisis un pouvoir</h2><p class="muted">Tu n\'en gardes qu\'un. Les aides se dépensent, les reliques durent toute la partie.</p>'+
   (next&&next.final?'<div class="aviso"><b>Attention, la Catrina t\'attend.</b> Ses questions sont plus difficiles, presque toutes à écrire, et elle frappe encore plus fort quand elle perd la moitié de sa vie.</div>':'')+
   '<div class="elige">'+S.offer.map((o,i)=>itemCard(o,i,false)).join('')+'</div>'+poderes(false);
}
function vShop(){
  const cura=S.hp<S.max&&S.gold>=4;
  return hud()+'<h2>El Tianguis</h2><p class="muted">Le jefe est vaincu et tu récupères 3 PV. Ce petit marché vend des aides : dépense tes monedas avant de partir vers '+ACTOS[S.act+1].n+'.</p><div class="elige">'+S.offer.map((o,i)=>itemCard(o,i,true)).join('')+
   '<button class="item" data-a="heal" '+(cura?'':'disabled')+'><span class="ico">🫔</span><span class="tp">Repas</span><span class="nm">Tamales</span><span class="ds">Rend 5 points de vie.</span><span class="px">🪙 4</span></button></div>'+
   '<div><button class="btn" data-a="leave">Partir vers '+ACTOS[S.act+1].n+'</button></div>'+poderes(false);
}
function vOver(){
  const tot=S.ok+S.ko+S.casi, pct=tot?Math.round(100*S.ok/tot):0;
  let h='<h1>'+(S.win?'¡Felicidades!':'¡Hasta el año que viene!')+'</h1><p class="lead">'+(S.win?'Tu as vaincu la Catrina. Les âmes ont retrouvé le chemin de la ofrenda grâce à toi.':S.enemy.n+' t\'a arrêté à l\'acte '+(S.act+1)+'. Relis ton carnet d\'erreurs, puis reprends le chemin.')+'</p>'+
   '<div class="stats"><div><b>'+S.won+'/12</b>combats gagnés</div><div><b>'+S.ok+'</b>bonnes réponses</div><div><b>'+pct+' %</b>de réussite</div></div>'+
   '<div><button class="btn" data-a="start">Rejouer</button></div>';
  if(S.errors.length){
    h+='<h2>Carnet d\'erreurs</h2><ul class="carnet">'+S.errors.map(e=>'<li><div class="q">'+esc(e.q)+'</div><div class="a" lang="es">'+esc(e.a)+'</div>'+(e.r?'<div class="r">'+esc(e.r)+'</div>':'')+'</li>').join('')+'</ul>';
  }else h+='<p class="muted">Aucune erreur dans cette partie. ¡Increíble!</p>';
  return h;
}
function vTitle(){
  const b=store('cempasuchil-best');
  return '<section class="portada"><span class="lbl">Roguelike d\'espagnol · séquence Día de Muertos</span><h1>El Camino de Cempasúchil</h1>'+
   '<p class="lead">C\'est la nuit du 1er au 2 novembre. Suis les pétales de cempasúchil du marché jusqu\'au Mictlán et réponds en espagnol pour vaincre les créatures du chemin. Au bout t\'attend la Catrina, la plus redoutable de toutes.</p>'+
   '<div class="cartas">'+ACTOS.map(a=>carta(a.boss,a.c)).join('')+'</div>'+
   '<div class="fila"><button class="btn" data-a="start">Commencer le chemin</button>'+(b&&b.won?'<span class="muted">Ton record : '+b.won+'/12 combats'+(b.wins?' · '+b.wins+' victoire'+(b.wins>1?'s':''):'')+'</span>':'')+'</div>'+
   '<div class="reglas"><div><b>Réponds pour attaquer</b>Vocabulaire, conjugaison (estar + gérondif), grammaire (ser, estar, hay, décrire une image) et culture.</div>'+
   '<div><b>Ramasse des pouvoirs</b>Traductor, Chuleta, Oráculo… Après chaque combat, choisis une aide ou une relique.</div>'+
   '<div><b>Écris pour frapper fort</b>Une réponse écrite fait plus de dégâts qu\'un QCM, et 3 bonnes réponses d\'affilée renforcent tes coups.</div>'+
   '<div><b>Attention au chrono</b>30 secondes par question au marché, 25 au cimetière, 20 au Mictlán, et 10 de plus pour écrire. Trop tard, c\'est une erreur.</div></div></section>';
}
function render(){
  $app.innerHTML = S.screen==='title'?vTitle():S.screen==='combat'?vCombat():S.screen==='reward'?vReward():S.screen==='shop'?vShop():vOver();
  fx=''; drawCrono();
  const i=document.getElementById('rep'), c=document.getElementById('cont');
  if(c) c.focus({preventScroll:true}); else if(i){i.focus({preventScroll:true}); i.setSelectionRange(i.value.length,i.value.length)}
}

/* ================== CHRONO ================== */
function drawCrono(){
  const c=document.getElementById('crono'); if(!c||!S.tMax) return;
  const s=Math.ceil(S.tLeft/1000);
  c.querySelector('i').style.width=(100*S.tLeft/S.tMax)+'%';
  c.querySelector('b').textContent=s+' s';
  c.classList.toggle('urge',S.tLeft<=5000);
}
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(), dt=now-lastTick; lastTick=now;
  if(S.screen!=='combat'||S.fb||!S.q||document.hidden) return;
  S.tLeft=Math.max(0,S.tLeft-Math.min(dt,1000));
  if(S.tLeft<=0) answer(null,false,true); else drawCrono();
},200);

/* ================== ÉVÉNEMENTS ================== */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='start'){newRun();render();window.scrollTo(0,0)}
  else if(a==='opt') answer(S.q.options[+v]);
  else if(a==='cont') cont();
  else if(a==='pow') usePower(v);
  else if(a==='chr'){const i=document.getElementById('rep'); if(!i)return; const s=i.selectionStart??i.value.length,e=i.selectionEnd??s; i.value=i.value.slice(0,s)+v+i.value.slice(e); S.typed=i.value; i.focus(); i.setSelectionRange(s+1,s+1)}
  else if(a==='take'){gain(S.offer[+v].id); S.room++; startFight(); render()}
  else if(a==='buy'){const o=S.offer[+v],it=ITEMS[o.id]; if(o.sold||S.gold<it.p)return; S.gold-=it.p; gain(o.id); o.sold=true; render()}
  else if(a==='heal'){if(S.gold<4||S.hp>=S.max)return; S.gold-=4; S.hp=Math.min(S.max,S.hp+5); render()}
  else if(a==='leave'){S.act++; S.room=0; startFight(); render(); window.scrollTo(0,0)}
});
document.addEventListener('input',ev=>{if(ev.target.id==='rep')S.typed=ev.target.value});
document.addEventListener('submit',ev=>{ev.preventDefault(); if(ev.target.dataset.f==='write')answer(S.typed)});
document.addEventListener('keydown',ev=>{
  if(S.screen!=='combat'||S.fb||!S.q||S.q.mode!=='qcm'||ev.ctrlKey||ev.metaKey||ev.altKey) return;
  const n=+ev.key; if(n>=1&&n<=4){const o=S.q.options[n-1]; if(o&&!S.hidden.includes(o)) answer(o)}
});

/* ================== DÉMARRAGE ================== */
function boot(d){ d=d||(window.claude&&window.claude.hot&&window.claude.hot.data)||{}; if(d.S&&d.S.screen) S=d.S; render() }
try{ window.claude?.hot?.snapshot?.(()=>({S})) }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot();
</script>
